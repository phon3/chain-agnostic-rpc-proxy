# DEPRECATED: legacy Railway Config as Code. Railway stops reading this file on 2026-12-01.
# The source of truth is now /.railway/railway.ts (Infrastructure as Code).
# Do NOT delete this file until `railway config migrate cutover` has cleared the
# service's Config File Path (/railway.toml); deleting it first breaks builds.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/health"
healthcheckTimeout = 100
